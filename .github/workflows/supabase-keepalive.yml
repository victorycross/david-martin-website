name: Keep Supabase awake

# Free Supabase projects pause after about a week with no activity, which took
# sign-in, the gallery and the reunion pages offline. A small read twice a week
# counts as activity and keeps the project running.
on:
  schedule:
    - cron: "17 14 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: src/integrations/supabase/client.ts
          sparse-checkout-cone-mode: false

      - name: Read the site's public Supabase URL and key
        id: cfg
        run: |
          f=src/integrations/supabase/client.ts
          url=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' "$f" | head -1)
          key=$(grep -oE 'SUPABASE_PUBLISHABLE_KEY = "[^"]+"' "$f" | sed -E 's/.*"([^"]+)"/\1/')
          echo "::add-mask::$key"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Query the database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: ${{ steps.cfg.outputs.key }}" \
            -H "Authorization: Bearer ${{ steps.cfg.outputs.key }}" \
            "${{ steps.cfg.outputs.url }}/rest/v1/posts?select=id&limit=1")
          echo "Supabase answered HTTP $code"
          test "$code" = "200"
